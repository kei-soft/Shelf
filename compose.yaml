services:
  neo4j:
    # 2026.01+ required: the vector index declares filterable properties so SEARCH can filter
    # inside the index (app/graph.py). 5.x cannot create that index.
    image: neo4j:2026.09.0-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change-this-local-password}"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  neo4j_data:
