[project]
name = "shelf-rag"
version = "0.1.0"
description = "Source-grounded chat with Deep Agents and Neo4j"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents==0.7.23", "langchain-openai", "langchain-ollama", "langgraph-checkpoint-sqlite",
  "fastapi", "uvicorn[standard]", "python-multipart", "python-dotenv",
  "neo4j>=5.28", "httpx", "beautifulsoup4", "pypdf", "ebooklib",
  "sqlalchemy", "psycopg[binary]", "tiktoken", "urllib3", "certifi"
]

[project.optional-dependencies]
ocr = ["pymupdf"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
